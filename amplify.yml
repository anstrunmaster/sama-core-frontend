version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
        - npm install @next/swc-linux-x64-gnu --legacy-peer-deps || true
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
